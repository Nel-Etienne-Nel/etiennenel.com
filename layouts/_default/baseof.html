<!doctype html>
<html lang="{{ site.Language.Locale | default "en-gb" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "scene.html" . }}
  {{ partial "nav.html" . }}
  {{ partial "bar.html" . }}
  {{ $js := resources.Get "js/field.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{ $scene := resources.Get "js/scene.js" | minify | fingerprint }}
  <script src="{{ $scene.RelPermalink }}" integrity="{{ $scene.Data.Integrity }}" defer></script>
</body>
</html>
