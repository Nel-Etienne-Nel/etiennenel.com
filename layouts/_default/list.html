{{ define "main" }}
{{ $pages := .RegularPages }}
<section class="stage short" aria-label="Visualizer">
  <canvas class="field" data-glyph="e,e" aria-hidden="true"></canvas>
  <div class="panels">
    <section class="panel title" id="info">
      <div class="panel-head caps">
        <h2>Index</h2>
        <button type="button" aria-expanded="true" aria-controls="title-body" data-toggle>−</button>
      </div>
      <div class="panel-body" id="title-body">
        <h1>{{ .Title }}</h1>
        <dl class="readout caps">
          <dt>Published</dt><dd>{{ len $pages }}</dd>
          {{ with index $pages 0 }}<dt>Latest</dt><dd>{{ .Date.Format site.Params.dateFormat }}</dd>{{ end }}
        </dl>
      </div>
    </section>
  </div>
  <div class="zoom" role="group" aria-label="Density">
    <button type="button" id="zin" aria-label="More characters">+</button>
    <button type="button" id="zout" aria-label="Fewer characters">−</button>
  </div>
</section>

<section class="index" aria-label="{{ .Title }}">
  {{ partial "rows.html" $pages }}
</section>
{{ end }}
