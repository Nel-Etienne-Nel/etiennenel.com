{{- /* Shared body for note / tip / warning. Context: dict "kind" "page" "inner" "title" */ -}}
<aside class="blk call {{ .kind }}" role="note">
  <div class="blk-head"><span>{{ .title | default .kind }}</span></div>
  <div class="blk-body">{{ .page.RenderString (dict "display" "block") .inner }}</div>
</aside>
