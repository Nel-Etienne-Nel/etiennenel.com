baseURL = 'https://etiennenel.com/'
locale = 'en-gb'
defaultContentLanguage = "en-gb"
title = "etiennenel.com"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[Languages.en-gb]
  label = "English"
  locale = "en-gb"
  contentDir = "content/en"
  weight = 1

[params]
  author = "Etienne Nel"
  description = "Once a week, Etienne writes without AI. An experiment in thinking a thought all the way through."
  mainSections = ['posts']
  dateFormat = "2 Jan 2006"
  rssFeedDescription = "summary"
  # The giant glyph the home-page field draws. Posts draw their number instead.
  glyph = "e,"
