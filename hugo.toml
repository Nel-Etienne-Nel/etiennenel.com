baseURL = 'https://etiennenel.com/'
locale = 'en-gb'
defaultContentLanguage = "en-gb"
title = "etiennenel.com"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[Languages.en-gb]
  label = "English"
  locale = "en-gb"
  contentDir = "content/en"
  weight = 1

[params]
  author = "Etienne Nel"
  description = "Etienne Nel. Technical docs on how things work, written with AI, and editorial pieces written by hand, without it."
  mainSections = ['technical', 'editorial']   # technical is written with AI; editorial by hand
  dateFormat = "2 Jan 2006"
  rssFeedDescription = "summary"
  # The giant glyph the home-page field draws. Posts draw their number instead.
  glyph = "e,"
