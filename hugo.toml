baseURL = 'https://etiennenel.com/'
locale = 'en-gb'
defaultContentLanguage = "en-gb"
title = "etiennenel.com"
enableRobotsTXT = true            # layouts/robots.txt, points at the sitemap
disableKinds = ["taxonomy", "term"]  # no tags or categories: no empty /tags/ pages

[markup]
  [markup.highlight]
    noClasses = false
    lineNumbersInTable = false   # line numbers inline, so copy can skip them
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[Languages.en-gb]
  label = "English"
  locale = "en-gb"
  contentDir = "content/en"
  weight = 1

[params]
  author = "Etienne Nel"
  # Search and sharing (layouts/partials/head.html, schema.html)
  homeTitle = "Etienne Nel · Technical docs and editorial writing"
  sameAs = ["https://github.com/Nel-Etienne-Nel"]
  ogImage = "og.png"          # static/og.png, 1200×630, used when a page has no image of its own
  ogImageAlt = "Etienne Nel: technical, written with AI. Editorial, handwritten, no AI."
  description = "Etienne Nel. Technical docs on how things work, written with AI, and editorial pieces written by hand, without it."
  mainSections = ['technical', 'editorial']   # technical is written with AI; editorial by hand
  dateFormat = "2 Jan 2006"
  rssFeedDescription = "summary"
  # The giant glyph the home-page field draws. Posts draw their number instead.
  glyph = "e,"
  # Contact address, stored in two halves and joined in the browser so the page
  # source never holds it whole. hello@ forwards via Cloudflare Email Routing.
  contactUser = "hello"
  contactDomain = "etiennenel.com"
